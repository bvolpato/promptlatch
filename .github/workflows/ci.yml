name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Python
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"
      - name: Sync environment
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv sync --python "$PYTHON_VERSION" --extra dev --locked
      - run: uv run pytest

  package:
    name: package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: uv sync --extra dev --group audit --locked
      - run: uv run scripts/check_release.py
      - run: uv run scripts/audit_secrets.py
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright src tests scripts
      - run: uv run pip-audit
      - run: uv build
      - run: helm lint ./charts/promptlatch
      - run: helm template promptlatch ./charts/promptlatch >/dev/null
      - run: uv run scripts/check_helm.py
      - run: docker build -t promptlatch:ci .
      - run: docker run --rm --entrypoint promptlatch promptlatch:ci version
