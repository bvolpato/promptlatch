apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "promptlatch.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "promptlatch.selectorName" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "promptlatch.selectorName" . }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "promptlatch.selectorName" . }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: promptlatch
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - containerPort: 8000
          {{- if .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret | quote }}
          {{- end }}
          env:
            {{- if .Values.serverAuth.enabled }}
            - name: PROMPTLATCH_REQUIRE_SERVER_API_KEY
              value: "true"
            {{- if not .Values.existingSecret }}
            - name: PROMPTLATCH_SERVER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "promptlatch.secretName" . | quote }}
                  key: PROMPTLATCH_SERVER_API_KEY
            {{- end }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if not .Values.existingSecret }}
            {{- range $key, $value := .Values.secretEnv }}
            {{- if or (and (ne $key "PROMPTLATCH_SERVER_API_KEY") (ne $key "PROMPTCLOAK_SERVER_API_KEY")) (not $.Values.serverAuth.enabled) }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "promptlatch.secretName" $ | quote }}
                  key: {{ $key }}
            {{- end }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
