{{- if and (not .Values.existingSecret) (or .Values.serverAuth.enabled .Values.secretEnv) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "promptlatch.secretName" . }}
type: Opaque
stringData:
  {{- if .Values.serverAuth.enabled }}
  PROMPTLATCH_SERVER_API_KEY: {{ include "promptlatch.serverApiKey" . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secretEnv }}
  {{- if or (and (ne $key "PROMPTLATCH_SERVER_API_KEY") (ne $key "PROMPTCLOAK_SERVER_API_KEY")) (not $.Values.serverAuth.enabled) }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
